# ThrottleGate Application Configuration - Development profile with H2
spring:
  application:
    name: throttle-gate
  datasource:
    url: jdbc:h2:mem:throttlegate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect

  # Redis/Valkey Configuration
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    ssl: ${SPRING_REDIS_SSL:false}

  # Spring Cloud Config is OPTIONAL and DISABLED by default
  cloud:
    config:
      enabled: false
      uri: http://localhost:8888

server:
  port: 8080

# ThrottleGate Specific Configuration
throttlegate:
  algorithm: token-bucket
  window-size-seconds: 60
  resilience:
    mode: ${THROTTLEGATE_RESILIENCE_MODE:fail-open}
  default-limits:
    # Format: tier:endpoint -> requests per window
    "[free:/events]": 100
    "[free:/payments]": 10
    "[free:/default]": 50
    "[pro:/events]": 1000
    "[pro:/payments]": 100
    "[pro:/default]": 500
  cors:
    allowed-origins: http://localhost:3000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  server:
    port: ${MANAGEMENT_PORT:8080}

# Security defaults
app:
  security:
    username: ${APP_SECURITY_USERNAME}
    password: ${APP_SECURITY_PASSWORD}

# Logging
logging:
  level:
    com.throttlegate: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN