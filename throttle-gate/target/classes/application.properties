# ThrottleGate Application Properties
spring.application.name=throttle-gate
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/throttlegate
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis/Valkey Configuration
spring.redis.host=localhost
spring.redis.port=6379

# Spring Cloud Config (for hot-reload)
spring.cloud.config.enabled=true
spring.cloud.config.uri=http://localhost:8888

# ThrottleGate Specific Configuration
throttlegate.algorithm=token-bucket
throttlegate.window-size-seconds=60

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.throttlegate=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG