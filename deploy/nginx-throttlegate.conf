# /etc/nginx/conf.d/throttlegate.conf — dashboard + API reverse proxy
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;   # built dashboard (npm run build output)
    index index.html;

    # API — proxied to the Spring Boot service (actuator health included)
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
